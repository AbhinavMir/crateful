name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  helper:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: helper/requirements-dev.txt
      - run: pip install -r helper/requirements-dev.txt
      - run: ruff check .
        working-directory: helper
      - run: pytest
        working-directory: helper

  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check_version.sh
